plugins {
    // micronaut
    id "com.gradleup.shadow" version "9.4.0"
    id "io.micronaut.application" version "4.6.2"

    // akhq
    id "com.gorylenko.gradle-git-properties" version "2.5.7"
    id 'com.adarshr.test-logger' version '4.0.0'
    id 'org.gradle.test-retry' version '1.6.4'
    id 'com.github.psxpaul.execfork' version '0.2.2'
    id "com.github.ben-manes.versions" version "0.53.0"
    id "com.github.davidmc24.gradle.plugin.avro" version "1.9.1"
    // idea
    id "org.jetbrains.gradle.plugin.idea-ext" version "1.4.1"
}
java {
    sourceCompatibility = JavaVersion.toVersion("25")
    targetCompatibility = JavaVersion.toVersion("25")
}
application {
    mainClass.set("org.akhq.App")
}
group = "org.akhq"
version = "0.27.0"

repositories {
    mavenLocal()
    mavenCentral()
    maven { url = 'https://packages.confluent.io/maven/' }
    maven { url = 'https://jitpack.io' }
    maven { url = "https://confluent-snapshots.public.confluent.io/" }
}


configurations.all {
    exclude group: 'org.slf4j', module: 'slf4j-log4j12'
    exclude group: 'org.apache.logging.log4j', module: 'log4j-slf4j-impl'
    exclude group: 'org.apache.logging.log4j', module: 'log4j-slf4j2-impl'
    exclude group: 'org.apache.logging.log4j', module: 'log4j-to-slf4j'
    exclude group: 'org.slf4j', module: 'slf4j-reload4j'
    // Exclude legacy org.lz4 provider so we can consistently use the relocated at.yawk.lz4
    exclude group: 'org.lz4', module: 'lz4-java'
    // Explicitly exclude missing Confluent telemetry modules from all configurations
    exclude group: 'io.confluent', module: 'telemetry-events'
    exclude group: 'io.confluent', module: 'telemetry-api'

    resolutionStrategy {
        force("org.apache.kafka:kafka-clients:" + kafkaVersion)
        force("org.apache.kafka:kafka-streams:" + kafkaVersion)
        force("org.apache.kafka:kafka-server-common:" + kafkaVersion)
        force("org.apache.kafka:kafka_" + kafkaScalaVersion + ":" + kafkaVersion)
        force("org.apache.kafka:kafka-metadata:" + kafkaVersion)
        force("org.apache.kafka:kafka-server:" + kafkaVersion)
        force("org.apache.kafka:kafka-raft:" + kafkaVersion)
        force("com.fasterxml.jackson.core:jackson-databind:" + jacksonVersion)
        force("com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:" + jacksonVersion)
        force("com.fasterxml.jackson.module:jackson-module-scala_" + kafkaScalaVersion + ":" + jacksonVersion)
    }
}

// Apply Confluent-related exclusions to both runtime and test runtime classpaths
[configurations.runtimeClasspath, configurations.testRuntimeClasspath].each { conf ->
    conf?.exclude group: 'io.confluent.observability', module: 'telemetry-events'
    conf?.exclude group: 'io.confluent.observability', module: 'telemetry-api'
    conf?.exclude group: 'io.confluent.resourcemanager', module: 'apiserver-client'
}

/**********************************************************************************************************************\
 * IntelliJ IDEA
 **********************************************************************************************************************/
idea.project.settings {
    taskTriggers {
        beforeBuild generateAvroJava
        beforeRebuild generateAvroJava
    }
}

/**********************************************************************************************************************\
 * Micronaut
 **********************************************************************************************************************/
micronaut {
    runtime("netty")
    testRuntime("junit5")
    processing {
        incremental(true)
        annotations("org.akhq.*")
    }
}

/**********************************************************************************************************************\
 * Dependencies
 **********************************************************************************************************************/

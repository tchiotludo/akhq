akhq:
  security:
    data-masking:
      mode: json_mask_by_default
      json-filters:
        - description: Unmask non-sensitive values
          topic: users
          keys:
            - specialId
            - status
            - address.country
            - metadata.trusted
            - metadata.rating
            - metadata.notes
            - metadata.other.shouldBeUnmasked
            - metadata.other.arrayToShow
            - metadata.other.jsonArray.showThis
        - description: Regex-looking filter that must be treated literally when regex is disabled
          topic: user-events-.*
          keys:
            - specialId
        - description: Dot must be a literal character when regex is disabled
          topic: orders.v1
          keys:
            - status

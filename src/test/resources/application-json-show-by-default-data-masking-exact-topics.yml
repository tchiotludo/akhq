akhq:
  security:
    data-masking:
      mode: json_show_by_default
      json-filters:
        - description: Mask sensitive values
          topic: users
          keys:
            - name
            - dateOfBirth
            - address.firstLine
            - address.town
            - metadata.other.shouldBeMasked
            - metadata.other.arrayToMask
            - metadata.other.jsonArray.maskThis
        - description: Regex-looking filter that must be treated literally when regex is disabled
          topic: user-events-.*
          keys:
            - name
        - description: Dot must be a literal character when regex is disabled
          topic: orders.v1
          keys:
            - status

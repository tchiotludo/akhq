akhq:
  security:
    data-masking:
      mode: json_mask_by_default
      json-filters:
        - description: Unmask non-sensitive values
          topic: users
          keys:
            - specialId
            - status
            - address.country
            - metadata.trusted
            - metadata.rating
            - metadata.notes
            - metadata.other.shouldBeUnmasked
            - metadata.other.arrayToShow
            - metadata.other.jsonArray.showThis
        - description: Unmask specialId for user events (regex)
          topic: user-events-.*
          keys:
            - specialId
        - description: Unmask status for user events (regex, uppercase pattern)
          topic: 'USER-EVENTS-\d+'
          keys:
            - status
        - description: Misconfigured filter without a topic (ignored)
          keys:
            - name

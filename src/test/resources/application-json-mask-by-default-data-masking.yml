akhq:
  security:
    data-masking:
      mode: json_mask_by_default
      json-filters:
        - description: Unmask non-sensitive values
          topic: users
          keys:
            - specialId
            - status
            - address.country
            - metadata.trusted
            - metadata.rating
            - metadata.notes
            - metadata.other.shouldBeUnmasked
            - metadata.other.arrayToShow
            - metadata.other.jsonArray.showThis
        - description: Unmask wildcard values
          topic: wildcard
          keys:
            - address.*
            - metadata.other.*
        - description: Unmask all values
          topic: unmask-all
          keys: ["*"]

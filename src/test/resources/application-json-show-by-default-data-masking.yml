akhq:
  security:
    data-masking:
      mode: json_show_by_default
      json-filters:
        - description: Mask sensitive values
          topic: users
          keys:
            - name
            - dateOfBirth
            - address.firstLine
            - address.town
            - metadata.other.shouldBeMasked
            - metadata.other.arrayToMask
            - metadata.other.jsonArray.maskThis
        - description: Mask name for user events (regex)
          topic: user-events-.*
          keys:
            - name
        - description: Mask dateOfBirth for user events (regex, uppercase pattern)
          topic: 'USER-EVENTS-\d+'
          keys:
            - dateOfBirth
        - description: Misconfigured filter without a topic (ignored)
          keys:
            - name

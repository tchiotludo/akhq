# Isolated Apache Kafka 3.9 test cluster: three dedicated controllers and three brokers.
name: akhq-kraft-visibility

x-common-env: &common-env
  CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
  KAFKA_CONTROLLER_QUORUM_VOTERS: 100@controller1:9093,101@controller2:9093,102@controller3:9093
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_LOG_DIRS: /tmp/kraft-logs
  KAFKA_HEAP_OPTS: -Xms128m -Xmx256m

x-controller: &controller
  image: apache/kafka:3.9.1
  environment: &controller-env
    <<: *common-env
    KAFKA_PROCESS_ROLES: controller
    KAFKA_LISTENERS: CONTROLLER://:9093
    KAFKA_ADVERTISED_LISTENERS: ""

x-broker: &broker
  image: apache/kafka:3.9.1
  environment: &broker-env
    <<: *common-env
    KAFKA_PROCESS_ROLES: broker
    KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
    KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
    KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
    KAFKA_DEFAULT_REPLICATION_FACTOR: 3

services:
  controller1:
    <<: *controller
    environment:
      <<: *controller-env
      KAFKA_NODE_ID: 100
  controller2:
    <<: *controller
    environment:
      <<: *controller-env
      KAFKA_NODE_ID: 101
  controller3:
    <<: *controller
    environment:
      <<: *controller-env
      KAFKA_NODE_ID: 102
  broker1:
    <<: *broker
    ports: ["127.0.0.1:19092:19092"]
    environment:
      <<: *broker-env
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://broker1:9092,EXTERNAL://localhost:19092
  broker2:
    <<: *broker
    ports: ["127.0.0.1:29092:29092"]
    environment:
      <<: *broker-env
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://broker2:9092,EXTERNAL://localhost:29092
  broker3:
    <<: *broker
    ports: ["127.0.0.1:39092:39092"]
    environment:
      <<: *broker-env
      KAFKA_NODE_ID: 3
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:39092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://broker3:9092,EXTERNAL://localhost:39092
